[package]
name = "embassy-ti-cc2650-examples"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
embassy-futures = { version = "0.1.2", path = "../../embassy-futures" }
embassy-executor = { version = "0.10.0", path = "../../embassy-executor", features = ["platform-cortex-m", "executor-thread"] }
cortex-m = { version = "0.7.6", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.6.15"
embassy-ti-cc2650 = { version = "0.1.0", path = "../../embassy-ti-cc2650" }
# In the future, this should probably be removed in favor of the custom handlers.
panic-probe = { version = "1.0.0" }
heapless = "0.9.3"

[package.metadata.embassy]
build = [
  { target = "thumbv7m-none-eabi", artifact-dir = "out/examples/ti-cc2650" }
]
