[package]
name = "embassy-ti-cc2650-no-time-examples"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
embassy-executor = { version = "0.10.0", path = "../../embassy-executor", features = ["platform-cortex-m", "executor-thread"] }
cortex-m = { version = "0.7.6", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = ">=0.6.15,<0.8"
embassy-ti-cc2650 = { version = "0.1.0", path = "../../embassy-ti-cc2650" }
# In the future, this should probably be removed in favor of the custom handlers.
panic-probe = { version = "1.0.0" }
static_cell = "2.1.1"

[package.metadata.embassy]
build = [
  { target = "thumbv7m-none-eabi", artifact-dir = "out/examples/embassy-ti-cc2650-no-time" }
]
